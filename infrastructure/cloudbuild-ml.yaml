# AgroSatCopilot — Cloud Build minimal: ml-train + mlflow
#
# US-022-c P1 etapa 2 (2026-05-23): pipeline aislada para construir y pushear
# solo las imagenes ML criticas (ml-train para Vertex AI L4 + mlflow para
# tracking server). El cloudbuild.yaml maestro deploya tambien backend/frontend
# y falla cuando esos contextos no compilan; aqui aislamos las dos imagenes
# que el bloque P1 necesita para desbloquear el smoke y el job FarSLIP.
#
# Uso:
#   gcloud builds submit --config=infrastructure/cloudbuild-ml.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD),\
#     _PROJECT_ID=agrosat-copilot,_REGION=us-central1,_AR_REPO=agrosat \
#     --project=agrosat-copilot

substitutions:
  _PROJECT_ID: agrosat-copilot
  _REGION: us-central1
  _AR_REPO: agrosat

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

timeout: 3600s

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/ml-train:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/ml-train:latest"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:latest"

steps:
  - id: build-mlflow
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - infrastructure/docker/mlflow.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:latest
      - .

  - id: build-ml-train
    name: gcr.io/cloud-builders/docker
    waitFor: ["-"]
    args:
      - build
      - -f
      - infrastructure/docker/ml-train.Dockerfile
      - --target=runtime
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/ml-train:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/ml-train:latest
      - .
