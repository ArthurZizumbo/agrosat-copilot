# AgroSatCopilot - Cloud Build SOLO mlflow image
#
# US-022-c P1 etapa 3a fix (2026-05-24): pipeline dedicada para reconstruir UNICAMENTE
# la imagen mlflow tras cambios al wrapper mlflow-start.sh. Evita rebuild de ml-train
# (5.65 GB, ~15 min) cuando solo cambia el ENTRYPOINT de mlflow.
#
# Uso:
#   gcloud builds submit --config=infrastructure/cloudbuild-mlflow-only.yaml \
#     --substitutions=SHORT_SHA=$(git rev-parse --short HEAD) \
#     --project=agrosat-copilot

substitutions:
  _PROJECT_ID: agrosat-copilot
  _REGION: us-central1
  _AR_REPO: agrosat

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

timeout: 600s

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:latest"

steps:
  - id: build-mlflow
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infrastructure/docker/mlflow.Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_AR_REPO}/mlflow:latest
      - .
