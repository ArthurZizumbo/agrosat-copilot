<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSatCopilot --- Equipo 17 (MNA Tec de Monterrey)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="reveal-base-theme">
  <!-- Fuentes auto-alojadas (base64): garantizan que el PDF embeba Fraunces,
       Spectral e Inter y que la presentacion no dependa del CDN de Google. -->
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

<!-- Switch de idioma -->
<div id="lang-toggle">
  <button data-lang="es" class="active">ES</button>
  <button data-lang="en">EN</button>
</div>

<!-- Marca institucional persistente. El logo real (logo_tec.png) aparece si esta
     presente; si no, se muestra el wordmark tipografico como respaldo. -->
<div id="brand">
  <img id="brand-logo" src="assets/figs/logo_tec.png" alt="Tecnologico de Monterrey"
       onerror="this.style.display='none'; document.getElementById('brand-wordmark').style.display='flex';">
  <div id="brand-wordmark" style="display:none">
    <span class="bw-1">Tecnol&oacute;gico de Monterrey</span>
    <span class="bw-2" data-lang-es>Maestr&iacute;a en Inteligencia Artificial Aplicada</span>
    <span class="bw-2" data-lang-en>Master in Applied Artificial Intelligence</span>
  </div>
</div>

<!-- Las laminas las construye js/render.js desde content/{es,en}.json -->
<div class="reveal">
  <div class="slides"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
<script src="js/slides.js"></script>
<script src="js/render.js"></script>
</body>
</html>
