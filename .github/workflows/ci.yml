# CI — solo validacion (lint, format, type check, tests, migrations, terraform validate).
# NO hay deploy aqui. Si en el futuro se agrega deployment real (docker build + push,
# Cloud Run deploy, etc.), debe ir en `deploy.yml` separado con trigger
# `on: push: branches: [main]` para que solo corra POST-merge a main.

name: CI

on:
  push:
    # Solo main/develop: las ramas personales (user/<n>/*, us-XXX) NO disparan
    # push CI — la cobertura entra al abrir el PR. Esto evita correr CI por
    # cada commit intermedio mientras se itera local.
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"     # pyproject.toml usa formato Poetry 2.x (requires-poetry >=2.0)
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "10"          # frontend/package.json#engines exige pnpm >=10
  TERRAFORM_VERSION: "1.9.8"

jobs:
  # ---------------------------------------------------------------------------
  # Detecta que areas se tocaron en el push/PR para skipear jobs irrelevantes.
  # En `push` (post-merge a main/develop) IGNORAMOS el filtro y corremos todo
  # como red de seguridad. En `pull_request` solo corremos lo relevante.
  # ---------------------------------------------------------------------------
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
      db: ${{ steps.filter.outputs.db }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'ml/**'
              - 'backend/**'
              - 'tests/**'
              - 'scripts/**'
              - 'dagster_project/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'
            db:
              - 'db/**'
              - '.github/workflows/**'
            terraform:
              - 'infrastructure/terraform/**'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # Python lint + unit tests
  # ---------------------------------------------------------------------------
  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS 3.4 oficial. pgvector se instala via apt en el primer step
        # del job (mismo patron que `infrastructure/docker/postgres.Dockerfile`
        # del local). TODO US-022c P4: construir la Dockerfile del proyecto a
        # GHCR para evitar el step extra.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: agrosat
          POSTGRES_PASSWORD: agrosat
          POSTGRES_DB: agrosat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrosat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pgvector in postgres service container
        # postgis/postgis:15-3.4 trae PostGIS pero NO pgvector. Las migraciones
        # que hacen `CREATE EXTENSION vector` revientan. Instalamos el paquete
        # en runtime (mismo patron del Dockerfile local).
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends postgresql-15-pgvector
          '

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Cache Poetry venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
            .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install deps (dev,test only — ml/geo excluded for speed)
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with dev,test --no-root --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Lint format (ruff format --check)
        run: poetry run ruff format --check .

      - name: Type check (mypy)
        # `working-directory: backend` evita el error "Source file found twice
        # under different module names" — sin esto, mypy desde repo root ve
        # `backend/app/api/health.py` como `app.api.health` Y `backend.app...`.
        working-directory: backend
        run: poetry run mypy app/ || echo "mypy not blocking until US-009"

      - name: Unit tests (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://agrosat:agrosat@localhost:5432/agrosat
        run: poetry run pytest backend/tests/unit -v || echo "no unit tests yet"

  # ---------------------------------------------------------------------------
  # Frontend lint
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint || echo "lint not configured yet"

  # ---------------------------------------------------------------------------
  # Database migrations (dbmate) on Postgres + PostGIS service
  # ---------------------------------------------------------------------------
  db:
    name: db-migrations
    needs: changes
    if: needs.changes.outputs.db == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS 3.4 oficial. pgvector se instala via apt en el primer step
        # del job (mismo patron que `infrastructure/docker/postgres.Dockerfile`
        # del local). TODO US-022c P4: construir la Dockerfile del proyecto a
        # GHCR para evitar el step extra.
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: agrosat
          POSTGRES_PASSWORD: agrosat
          POSTGRES_DB: agrosat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agrosat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pgvector in postgres service container
        # Mismo motivo que el job python-*: postgis/postgis:15-3.4 sin pgvector.
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c '
            apt-get update -qq
            apt-get install -y --no-install-recommends postgresql-15-pgvector
          '

      - name: Install dbmate
        run: |
          curl -fsSL -o /tmp/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /tmp/dbmate
          sudo mv /tmp/dbmate /usr/local/bin/dbmate

      - name: Run migrations
        env:
          DATABASE_URL: postgres://agrosat:agrosat@localhost:5432/agrosat?sslmode=disable
        run: |
          dbmate up
          dbmate status

  # ---------------------------------------------------------------------------
  # Terraform validation (syntax only, no backend, no apply)
  # ---------------------------------------------------------------------------
  terraform:
    name: terraform-validate
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: fmt check
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: init + validate dev
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  # ---------------------------------------------------------------------------
  # Secret scanning + i18n key sync
  # ---------------------------------------------------------------------------
  quality:
    name: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notebooks: NO stripping enforced - se commitean con outputs poblados
      # (entregable visual del curso). La reproducibilidad se valida via
      # `make notebooks-check` con papermill (job aparte, no quality gate
      # bloqueante en cada PR porque requiere data PASTIS-R + auth GEE).

      - name: i18n key parity (it/es/en)
        run: |
          python - <<'PY'
          import json, sys, pathlib
          locales_dir = pathlib.Path("frontend/i18n/locales")
          if not locales_dir.exists():
              locales_dir = pathlib.Path("frontend/locales")
          if not locales_dir.exists():
              print("no locales dir yet, skipping")
              sys.exit(0)
          locales = {}
          for code in ("it", "es", "en"):
              fp = locales_dir / f"{code}.json"
              if not fp.exists():
                  print(f"missing {fp}")
                  sys.exit(0)
              locales[code] = json.loads(fp.read_text(encoding="utf-8"))

          def flat(d, prefix=""):
              for k, v in d.items():
                  key = f"{prefix}{k}"
                  if isinstance(v, dict):
                      yield from flat(v, key + ".")
                  else:
                      yield key
          sets = {c: set(flat(v)) for c, v in locales.items()}
          ref = sets["en"]
          fail = False
          for c, s in sets.items():
              missing = ref - s
              extra = s - ref
              if missing or extra:
                  print(f"{c}: missing={sorted(missing)} extra={sorted(extra)}")
                  fail = True
          sys.exit(1 if fail else 0)
          PY
